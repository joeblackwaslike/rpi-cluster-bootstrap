apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: newrelic-bundle
  namespace: kube-system
spec:
  repo: https://helm-charts.newrelic.com
  chart: nri-bundle
  version: 8.0.40
  targetNamespace: newrelic
  valuesContent: |-
    global:
      cluster: cluster
      region: US
      lowDataMode: true
      customSecretName: newrelic-license
      customSecretLicenseKey: licenseKey
    kube-state-metrics:
      enabled: true
      image:
        tag: v2.13.0
    kubeEvents:
      enabled: true
    newrelic-prometheus-agent:
      enabled: true
      lowDataMode: true
      config:
        kubernetes:
          integrations_filter:
            enabled: true
            app_values: ["traefik"]
        extra_scrape_configs:
          - job_name: kube-etcd
            static_configs:
              - targets: ["192.168.1.149:2381"]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: etcd_server_has_leader|etcd_mvcc_db_total_size_in_bytes|etcd_server_quota_backend_bytes
                action: keep
    newrelic-infrastructure:
      common:
        config:
          interval: 40s
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                  - newrelic
                  - longhorn-system
                  - metallb-system
                  - kubernetes-dashboard
                  - tailscale
                  - cloudflared
                  - cloudflare-operator-system
                  - cert-manager
                  - cert-manager-porkbun
    nr-ebpf-agent:
      enabled: false
    k8s-agents-operator:
      enabled: true
    logging:
      enabled: true
    newrelic-logging:
      extraVolumes:
        - name: run-journal
          hostPath:
            path: /run/log/journal
            type: Directory
      extraVolumeMounts:
        - name: run-journal
          mountPath: /run/log/journal
          readOnly: true
      fluentBit:
        config:
          extraInputs: |
            [INPUT]
                Name            systemd
                Alias           host-journal
                Tag             journal.*
                Path            /run/log/journal
                Systemd_Filter  _SYSTEMD_UNIT=k3s.service
                Systemd_Filter  _SYSTEMD_UNIT=k3s-agent.service
                Systemd_Filter  _TRANSPORT=kernel
                Systemd_Filter  PRIORITY=0
                Systemd_Filter  PRIORITY=1
                Systemd_Filter  PRIORITY=2
                Systemd_Filter  PRIORITY=3
                Systemd_Filter  PRIORITY=4
                Read_From_Tail  On
                DB              /var/log/flb_systemd.db
          lowDataModeFilters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Alias               kubernetes-enricher
                Kube_URL            https://kubernetes.default.svc.cluster.local:443
                Buffer_Size         ${K8S_BUFFER_SIZE}
                K8S-Logging.Exclude ${K8S_LOGGING_EXCLUDE}
                Labels              Off
                Annotations         Off

            [FILTER]
                Name           nest
                Match          kube.*
                Alias          kubernetes-attribute-lifter
                Operation      lift
                Nested_under   kubernetes

            [FILTER]
                Name     grep
                Match    kube.*
                Alias    nzbget-log-excluder
                Exclude  pod_name ^nzbget

            [FILTER]
                Name           record_modifier
                Match          kube.*
                Alias          pod-log-allowlist
                Record         cluster_name ${CLUSTER_NAME}
                Record         node_name ${NODE_NAME}
                Allowlist_key  container_name
                Allowlist_key  namespace_name
                Allowlist_key  pod_name
                Allowlist_key  stream
                Allowlist_key  message
                Allowlist_key  log

            [FILTER]
                Name     modify
                Match    journal.*
                Alias    journal-field-renamer
                Rename   MESSAGE message
                Rename   _SYSTEMD_UNIT unit
                Rename   _TRANSPORT transport
                Rename   SYSLOG_IDENTIFIER identifier

            [FILTER]
                Name     grep
                Match    journal.*
                Alias    journal-audit-excluder
                Exclude  message ^(audit:|kauditd_printk_skb)

            [FILTER]
                Name           record_modifier
                Match          journal.*
                Alias          journal-allowlist
                Record         cluster_name ${CLUSTER_NAME}
                Record         node_name ${NODE_NAME}
                Allowlist_key  message
                Allowlist_key  unit
                Allowlist_key  transport
                Allowlist_key  identifier
                Allowlist_key  PRIORITY
