apiVersion: newrelic.com/v1beta2
kind: Instrumentation
metadata:
  name: newrelic-instrumentation
  namespace: newrelic
spec:
  agent:
    language: nodejs
    image: newrelic/newrelic-node-init:latest
  podLabelSelector:
    matchExpressions:
      - key: instrument
        operator: In
        values: ["true"]
