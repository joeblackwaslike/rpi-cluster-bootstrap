apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-capacity
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: etcd-capacity
    rules:
    - alert: EtcdDbNearQuota
      expr: etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes > 0.7
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: etcd database is over 70% of its quota
        description: At quota, k3s crash-loops. See the etcd section of docs/operations.md.
    - alert: EtcdUnstable
      expr: avg_over_time(up{job="kube-etcd"}[15m]) < 0.8
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: etcd was unreachable for more than 20% of the last 15 minutes
        description: Embedded etcd goes away whenever k3s restarts. See the etcd section of docs/operations.md.
