USER-SUPPLIED VALUES:
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      routes:
      - receiver: pagerduty
        matchers:
        - severity = "critical"
        continue: true
      - receiver: ntfy
        matchers:
        - severity =~ "warning|critical"
    receivers:
    - name: "null"
    - name: ntfy
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/ntfy-webhook/url
        send_resolved: true
    - name: pagerduty
      pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key/key
        send_resolved: true
  alertmanagerSpec:
    externalUrl: https://alertmanager.joeblack.nyc
    secrets:
    - ntfy-webhook
    - pagerduty-routing-key
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn
defaultRules:
  rules:
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
    - action: drop
      regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      sourceLabels: [__name__, le]
    - action: drop
      regex: apiserver_request_(sli_)?duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket
      sourceLabels: [__name__]
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: true
  endpoints:
  - 192.168.1.149
  service:
    enabled: true
    port: 2381
    targetPort: 2381
grafana:
  adminPassword: changeme
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: longhorn
prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.joeblack.nyc
    retention: 7d
    resources:
      requests:
        memory: 768Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
