USER-SUPPLIED VALUES:
alertmanager:
  config:
    route:
      receiver: ntfy
      group_by: [alertname, namespace]
      routes:
      - receiver: "null"
        matchers:
        - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
    - name: "null"
    - name: ntfy
      webhook_configs:
      - url_file: /etc/alertmanager/secrets/ntfy-webhook/url
        send_resolved: true
  alertmanagerSpec:
    secrets:
    - ntfy-webhook
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
          storageClassName: longhorn
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: true
  endpoints:
  - 192.168.1.149
  service:
    enabled: true
    port: 2381
    targetPort: 2381
grafana:
  adminPassword: changeme
  ingress:
    enabled: false
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: longhorn
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
